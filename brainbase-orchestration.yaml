schema: 1
orchestration:
  name: Afterlife Person 1
  description: Scout, invest, and verify one recovered software capability
members:
  - slug: scout
    name: Afterlife Scout
  - slug: investment
    name: Afterlife Investment Committee
  - slug: resurrection
    name: Afterlife Resurrection Engineer
edges:
  - from: scout
    to: investment
    description: Send evidence for every candidate, without choosing a winner
    payload_schema:
      type: object
      required: [candidates]
      additionalProperties: false
      properties:
        candidates:
          type: array
          minItems: 1
          items:
            type: object
            required: [repository, repositoryUrl, name, license, commercial_use, license_evidence, last_meaningful_activity, neglect_evidence, languages, runtime, dependencies, capability, input, output, compute, build_complexity, recovery_probability, potential_users, product_hypothesis, monetization, technical_risks, legal_risks, demo_strength, recommendation]
            properties:
              repository: {type: string}
              repositoryUrl: {type: string}
              name: {type: string}
              license: {type: string}
              license_evidence: {type: string}
              last_meaningful_activity: {type: string}
              languages: {type: array, items: {type: string}}
              dependencies: {type: array, items: {type: string}}
              recommendation: {type: string}
              commercial_use: {type: string, enum: [yes, no, uncertain]}
              capability: {type: string}
              input: {type: string}
              output: {type: string}
              runtime: {type: string}
              compute: {type: string}
              neglect_evidence: {type: array, items: {type: string}}
              build_complexity: {type: string, enum: [low, medium, high]}
              recovery_probability: {type: string, enum: [low, medium, high]}
              potential_users: {type: array, items: {type: string}}
              product_hypothesis: {type: string}
              monetization: {type: string}
              technical_risks: {type: array, items: {type: string}}
              legal_risks: {type: array, items: {type: string}}
              demo_strength: {type: string, enum: [low, medium, high]}
  - from: investment
    to: resurrection
    description: FUND only; send selected repository and exact target capability
    payload_schema:
      type: object
      required: [repositoryUrl, targetCapability]
      additionalProperties: false
      properties:
        repositoryUrl: {type: string}
        targetCapability: {type: string}
        maximumRecoveryBudget: {type: number, minimum: 0}
